schemaVersion: 2
kind: Activity
metadata:
  name: list_backlog_tasks
spec:
  type: deterministic
  description: >
    Materialize the current workspace backlog as an ordered task list for
    the auto-pipeline. In automatic mode it filters to `status: backlog` with
    all task dependencies satisfied, excludes `epic`-tagged roots and every
    descendant of such a root (`epic_root` / `epic_child`), and
    drops any backlog parent/subtask group whose `context_files` overlap the
    active task-lock surface from `in-progress` or `review` tasks. Automatic
    mode includes an `excluded` array that attributes epic-family and pre-gate
    lock exclusions; it does not report status-based admission or `max_tasks`
    truncation. Explicit `task_ids` input is treated as an override, skips
    conflict filtering, and omits `excluded`.
    Sorts critical → high → medium → low, then by `created_at` ascending so
    older high-priority work ships first. Caps at `max_tasks` (default 50) to
    keep the agent's context window bounded. Also emits conservative singleton
    `bundles` so downstream dispatch can proceed without depending on an
    agent's final response payload, and `dispatch_bundles`, which pairs each
    bundle with the pipeline mode it must ship through. The run's `mode` is the
    default; a task whose shape needs its own pipeline (today, a
    `ci-failure-remediation` task under `pr` mode) refines it here, where the
    task record is in hand. Ordinary `pr` and `local` dispatch is unchanged.
  input_schema_json:
    type: object
    properties:
      max_tasks:
        type: number
        minimum: 1
        maximum: 500
      task_ids:
        type: array
        items:
          type: string
      mode:
        type: string
        enum: [pr, local, ci_remediation]
        description: Run-level default pipeline mode. Defaults to `pr`.
  output_schema_json:
    type: object
    required: [tasks, task_ids, task_count, bundles, dispatch_bundles]
    properties:
      task_count:
        type: number
      task_ids:
        type: array
        items:
          type: string
      bundles:
        type: array
        items:
          type: array
          items:
            type: string
      dispatch_bundles:
        type: array
        items:
          type: object
          required: [task_ids, mode]
          properties:
            task_ids:
              type: array
              items:
                type: string
            mode:
              type: string
              enum: [pr, local, ci_remediation]
      tasks:
        type: array
        items:
          type: object
          required: [id, title, type, priority, context_files]
          properties:
            id:
              type: string
            title:
              type: string
            type:
              type: string
            priority:
              type: string
            context_files:
              type: array
              items:
                type: string
            parent_id:
              oneOf:
                - type: string
                - type: "null"
      excluded:
        type: array
        items:
          type: object
          required: [id, reason, conflicts]
          properties:
            id:
              type: string
            reason:
              type: string
              enum: [context_lock_conflict, epic_child, epic_root, group_member_conflict]
            conflicts:
              type: array
              items:
                type: object
                required: [requested_file, locking_task_id]
                properties:
                  requested_file:
                    type: string
                  locking_task_id:
                    type: string
  action: list_backlog_tasks
  config: {}
