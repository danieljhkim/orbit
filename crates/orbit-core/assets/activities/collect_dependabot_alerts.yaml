schemaVersion: 2
kind: Activity
metadata:
  name: collect_dependabot_alerts
spec:
  type: deterministic
  description: >
    Query open Dependabot, Code scanning, and secret scanning alerts plus open
    app/dependabot pull requests on the engine-private host boundary using
    NoSandbox, then emit one bounded and redacted snapshot. Each security
    family reports collection and capability independently. Secret values are
    structurally excluded before the snapshot is encoded.
  input_schema_json:
    type: object
    properties:
      workspace_path:
        type: string
      repo:
        type: string
      max_alerts:
        type: number
        minimum: 1
        maximum: 100
      max_pull_requests:
        type: number
        minimum: 1
        maximum: 100
      max_code_scanning_alerts:
        type: number
        minimum: 1
        maximum: 100
      max_secret_scanning_alerts:
        type: number
        minimum: 1
        maximum: 100
      max_secret_locations:
        type: number
        minimum: 1
        maximum: 100
  output_schema_json:
    type: object
    required: [phase, dependabot_snapshot]
    properties:
      phase:
        type: string
      dependabot_snapshot:
        type: object
        required: [schema_version, collected, capability, outcome_hint]
        properties:
          schema_version:
            type: number
          collected:
            type: boolean
          outcome_hint:
            type: string
          capability:
            type: object
          collection_status:
            type: string
          repository:
            type: object
          open_alerts:
            type: array
          open_dependabot_pull_requests:
            type: array
          query_errors:
            type: array
          truncation:
            type: object
          collected_at:
            type: string
          code_scanning:
            type: object
            required: [collected, collection_status, capability, outcome_hint, open_alerts]
          secret_scanning:
            type: object
            required: [collected, collection_status, capability, outcome_hint, open_alerts]
  action: collect_dependabot_alerts
  config: {}
