schemaVersion: 2
kind: Activity
metadata:
  name: validate_bundles
spec:
  type: deterministic
  description: >
    Validate the auto-dispatch bundle list before the fan_out dispatch.
    Fails the Run with a structured error if any bundle
    exceeds `max_bundle_size`, contains a duplicate task_id across
    bundles, or references an id not present in the input `known_task_ids`
    set. Pass-through on success so the fan_out can consume the same
    `bundles` shape without unwrapping a wrapper object — prevents a
    misgrouped backlog from silently dispatching.
    Also validates per-bundle routing: `dispatch_bundles` must carry exactly one
    entry per bundle covering the same task ids, so a routing decision cannot be
    silently dropped, and a bundle routed off `default_mode` must contain
    exactly one task, so a specially-routed task cannot acquire a neighbour and
    ship through the wrong pipeline. Callers that supply no `dispatch_bundles`
    get `default_mode` for every bundle.
  input_schema_json:
    type: object
    required: [bundles, max_bundle_size, known_task_ids]
    properties:
      bundles:
        type: array
        items:
          type: array
          items:
            type: string
      dispatch_bundles:
        type: [array, "null"]
        items:
          type: object
          properties:
            task_ids:
              type: array
              items:
                type: string
            mode:
              type: string
              enum: [pr, local, ci_remediation]
      default_mode:
        type: string
        enum: [pr, local, ci_remediation]
      max_bundle_size:
        type: number
      known_task_ids:
        type: array
        items:
          type: string
  output_schema_json:
    type: object
    required: [bundles, dispatch_bundles, bundle_count]
    properties:
      bundles:
        type: array
        items:
          type: array
          items:
            type: string
      dispatch_bundles:
        type: array
        items:
          type: object
          required: [task_ids, mode]
          properties:
            task_ids:
              type: array
              items:
                type: string
            mode:
              type: string
              enum: [pr, local, ci_remediation]
      bundle_count:
        type: number
  action: validate_bundles
  config: {}
