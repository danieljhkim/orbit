# Task bundle PR pipeline.
#
# Failure semantics:
# - `implement_bundle` runs one task at a time in the shared worktree.
# - If `implement_one` fails, earlier commits remain on the bundle branch.
# - While the run is still alive, tasks stay `in-progress`: a mid-bundle step
#   failure that the run recovers from does not block anything, and `pr_open`
#   ships the whole bundle to `review` only once the run succeeds.
# - When the run itself terminalizes as `failed` (also `cancelled`/`timeout`),
#   every task coupled to it (stamped with its `job_run_id` by `worktree_setup`)
#   is moved to `blocked` with a `workflow_run_failed` status event — a dead end
#   for automation that requires a human/orchestrator decision to clear. Tasks
#   already in `review`/`done` are left untouched.
#
# Optional review step:
# - `review_bundle` runs after `implement_bundle` when `input.review` is
#   `true` (default `false`). It invokes `agent_review`, which records
#   blocking findings as `ReviewThread`s on the participating tasks via
#   `orbit.task.review_thread.*` and applies fixes in-place. Unresolved
#   threads ride through to the PR via the existing review-thread sync;
#   the pipeline does not gate on agent output.

schemaVersion: 2
kind: Job
metadata:
  name: task_pr_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 10
  default_input:
    task_ids: []
    base_branch: main
    base_sync: remote
    review: false
    title: null
    body: null

  steps:
    - id: worktree
      target: activity:worktree_setup
      retry:
        max_attempts: 4
        initial_backoff_ms: 200
        backoff_cap_ms: 2000
        backoff_strategy: exponential
      default_input:
        task_ids: "{{ input.task_ids }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"

    - id: implement_bundle
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 256
        steps:
          - id: implement_one
            recovery_activity: step_failure_recovery
            target: activity:agent_implement
            default_input:
              task_id: "{{ item }}"
              workspace_path: "{{ steps.worktree.output.workspace_path }}"

    - id: review_bundle
      when: "{{ input.review }} == true"
      recovery_activity: step_failure_recovery
      target: activity:agent_review
      default_input:
        task_ids: "{{ input.task_ids }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_branch: "{{ input.base_branch }}"

    - id: push
      recovery_activity: step_failure_recovery
      target: activity:git_push
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"

    - id: pr_open
      recovery_activity: step_failure_recovery
      target: activity:pr_open
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"
        body: "{{ input.body }}"
        completed_task_ids: "{{ input.task_ids }}"
        title: "{{ input.title }}"
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
