[package]
name = "orbit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[features]
clap = ["orbit-common/clap"]

[dependencies]
chrono.workspace = true
croner.workspace = true
fs2.workspace = true
orbit-common = { path = "../orbit-common" }
orbit-search = { path = "../orbit-search" }
orbit-engine = { path = "../orbit-engine" }
orbit-policy = { path = "../orbit-policy" }
orbit-store = { path = "../orbit-store" }
orbit-tools = { path = "../orbit-tools" }
rusqlite.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile = "3"
tiktoken-rs.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
orbit-common = { path = "../orbit-common", features = ["test-util"] }
orbit-exec = { path = "../orbit-exec" }
