# Versioned model price table (ORB-10338, ADR-0245).
#
# Keyed by exact model string (the value that ends up in
# `InvocationRecord.model` — never a crew name or unversioned CLI alias) plus
# an effective date range. `orbit_common::types::pricing` looks up the row
# whose range covers an invocation's timestamp and derives USD cost from the
# row's token splits at query time; nothing here is baked into Rust.
#
# To add or correct a rate: add a new row (or edit an existing one) and land
# it as a normal data change — no code change required. When a provider
# changes pricing, close the old row with `effective_until` (exclusive) set
# to the change timestamp and add a new row starting there, so historical
# invocations keep pricing under the rate that was actually in effect.
#
# Rates are USD per 1,000,000 tokens. `effective_until` is exclusive; omit
# (or use `null`) for the current/open-ended rate.
prices:
  - model: "claude-opus-4-7"
    effective_from: "2026-01-01T00:00:00Z"
    effective_until: null
    input_per_million_usd: 15.0
    cache_read_per_million_usd: 1.5
    cache_create_per_million_usd: 18.75
    output_per_million_usd: 75.0

