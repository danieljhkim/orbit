[package]
name = "orbit-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[dependencies]
orbit-common = { path = "../orbit-common" }
rmcp = { version = "1.5", default-features = false, features = ["client", "server", "transport-io", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `io-util` supplies the in-memory duplex transport and `time` the request
# timeouts used by the crate-root wire integration tests.
tokio = { workspace = true, features = ["io-util", "time"] }
tracing-subscriber.workspace = true
