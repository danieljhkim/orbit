[package]
name = "orbit-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.orbit]
stability = "internal"

[lints]
workspace = true

[dependencies]
orbit-common = { path = "../orbit-common" }
rmcp = { version = "1.5", default-features = false, features = ["client", "server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
# `io-std` supplies the stdio half of the client-side relay (`relay_stdio`)
# and `io-util` the split/copy primitives it pumps bytes with [ORB-10710].
tokio = { workspace = true, features = ["io-std", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `io-util` supplies the in-memory duplex transport and `time` the request
# timeouts used by the crate-root wire integration tests.
tokio = { workspace = true, features = ["io-util", "time"] }
tracing-subscriber.workspace = true
