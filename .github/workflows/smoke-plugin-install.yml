name: smoke-plugin-install

# Exercises the Claude and Codex plugin install chains end-to-end against the
# published @orbit-tools/cli@latest and the latest GitHub Release tag. Catches
# drift between npm registry, plugin manifests, Codex packaging, and release
# assets.

on:
  schedule:
    # Mondays 12:00 UTC. Cheap weekly heartbeat that fails loudly if a
    # release ever leaves the chain in a broken state.
    - cron: "0 12 * * 1"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Codex CLI
        run: npm install -g @openai/codex@latest

      - name: Run plugin install smoke
        shell: bash
        run: ./scripts/smoke-plugin-install.sh
