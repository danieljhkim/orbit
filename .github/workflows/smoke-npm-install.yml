name: smoke-npm-install

# Exercises the published @orbit-tools/cli@latest npm proxy and the GitHub
# Release binary it downloads. Catches registry/release drift and failures in
# the postinstall-to-MCP chain.

on:
  schedule:
    # Mondays 12:00 UTC. Cheap weekly heartbeat that fails loudly if a
    # release ever leaves the chain in a broken state.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to verify (for example, v0.14.0)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Run npm install smoke
        shell: bash
        env:
          SMOKE_NPM_INSTALL_TAG: ${{ inputs.tag || '' }}
        run: ./scripts/smoke-npm-install.sh
