schema_version: 1
contract: orbit-mcp-bridge-v1
source_of_truth:
  exposed_tool_list:
    - crates/orbit-remote/src/mcp/host.rs::canonical_mcp_tool_definitions
  canonical_schema_registry:
    - crates/orbit-remote/src/mcp/host.rs::canonical_mcp_tool_definitions
  composed_from:
    - crates/orbit-tools/src/registry.rs::canonical_builtin_mcp_tool_definitions
    - crates/orbit-remote/src/mcp/discovery.rs::discovery_tool_definitions
  placement_metadata_owner:
    - crates/orbit-tools/src/builtin/orbit/mod.rs::register
    - crates/orbit-remote/src/mcp/discovery.rs::discovery_tool_definitions
  scope_metadata_owner:
    - crates/orbit-tools/src/builtin/orbit/mod.rs::register
    - crates/orbit-remote/src/mcp/discovery.rs::discovery_tool_definitions

capabilities:
  allowed_values: [agent, operator, runner]
  set_rules:
    - Every exposed tool has exactly one placement, one scope, and a non-empty allowed_capabilities set.
    - Placement and capability filtering are independent.
    - operator does not imply runner; runner does not imply agent.

scopes:
  allowed_values: [workspace-required, global]
  rules:
    - Existing tools default to workspace-required.
    - Only registry-wide discovery tools are global and may execute without a workspace selector.

private_connector:
  spoke_registration:
    method: orbit/private/register-spoke/v1
    schema_version: 1
    advertised: false
    ordinary_tools_call: false
    allowed_capabilities: [agent, operator, runner]
    unknown_caller_only_operation: true
    ordinary_calls_require_active_registration: true
    only_path_bearing_fields: ["presence[].root"]
    cache_refresh: definitive-complete-response-only
  knowledge_allocation:
    method: orbit/private/allocate-knowledge-id/v1
    schema_version: 1
    advertised: false
    ordinary_tools_call: false
    allowed_capabilities: [agent, operator]
    active_caller_required: true
    path_bearing_fields: []
    automatic_replay: false
    lookup_keys: [mcp_call_id, workspace-kind-id]

tools:
  orbit.task.add: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.approve: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.artifact.put: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.list: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.review_thread.add: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.review_thread.list: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.review_thread.reply: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.review_thread.resolve: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.show: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.start: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.task.update: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.friction.add: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.friction.list: { placement: hub, scope: workspace-required, allowed_capabilities: [operator] }
  orbit.friction.show: { placement: hub, scope: workspace-required, allowed_capabilities: [operator] }
  orbit.friction.tags: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.friction.update: { placement: hub, scope: workspace-required, allowed_capabilities: [operator] }
  orbit.host.list: { placement: hub, scope: global, allowed_capabilities: [operator] }
  orbit.workspace.list: { placement: hub, scope: global, allowed_capabilities: [operator] }
  orbit.crew.list: { placement: hub, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.search: { placement: composite, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.adr.add: { placement: composite, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.adr.list: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.adr.show: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.adr.supersede: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.adr.update: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.learning.add: { placement: composite, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.learning.list: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.learning.show: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.learning.update: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.learning.supersede: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.auto_task.add: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.auto_task.show: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.auto_task.update: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }
  orbit.auto_task.toggle: { placement: owner, scope: workspace-required, allowed_capabilities: [agent, operator] }

hub_schema_digest:
  domain_tag: orbit.mcp.hub-schema.v1
  contract_revision: 3
  canonical_registry_revision: 2
  golden_vector:
    capability: agent
    canonical_json: '{"canonical_registry_revision":2,"capability":"agent","tools":[{"advertised_name":"orbit_task_show","canonical_name":"orbit.task.show","description":"Show one task","input_schema":{"additionalProperties":true,"properties":{"id":{"description":"Task ID","type":"string"}},"required":["id"],"type":"object"}}]}'
    expected_sha256: 8c5856e3838ac33eab4e66401d846b9cc6f262a23d30af964c843496c0fe4ee8
  inputs:
    - canonical schema name, description, and input schema for every hub-placed tool
    - canonical schema name, description, and input schema for every composite tool's hub step
    - advertised MCP name mapping for each included canonical tool
    - canonical registry revision
    - private connector protocol revision, including orbit/private/register-spoke/v1 and orbit/private/allocate-knowledge-id/v1
  mismatch_behavior:
    - Reject hub routing before dispatch when revision or digest differs.
    - Local-derived and locally eligible owner calls may continue without a hub route.

run_protocol:
  capability: runner
  hub_endpoint_placement: hub
  allowed_operations: [presence, lease, heartbeat, report]
  transitions:
    - from: placed
      to: leased
      event: lease_granted
      invariant: actual placement records the leasing machine_id and never replaces requested placement.
    - from: leased
      to: placed
      event: lease_expired_before_execution
      invariant: pre-start loss is redeliverable only to the recorded placement; it is not automatic failover.
    - from: leased
      to: execution_started
      event: execution_started
      invariant: the runner records the start before execution side effects are considered recoverable.
    - from: execution_started
      to: recovery_required
      event: heartbeat_expired_or_outcome_unknown
      invariant: post-start uncertainty never redelivers automatically and requires explicit recovery.
    - from: recovery_required
      to: placed
      event: explicit_recovery_and_replacement
      invariant: a shepherd or operator records recovery before a new lease can be issued.

routing_expectations:
  topology:
    hub_count: 1
    coordination_writer: hub
    workspace_coordination_target: forbidden
    forbidden_config_forms: ["[hubs.<name>]", "workspace coordination-host"]
    unsupported: [spoke-to-spoke route, hub-to-owner proxy, replication, failover]
  hub:
    route: local short-circuit or the single hub link
    rejects: [second_hub_target, workspace_specific_coordination_target]
  owner:
    local_owner: execute locally in the validated owner checkout
    hub_owner: execute through the single hub link
    spoke_owner: reject_current_state_unavailable
    rejects: [hub_to_owner_proxy, spoke_to_spoke_route]
  local-derived:
    route: caller checkout only
    rejects: [hub_execution, missing_validated_checkout]
  composite:
    knowledge_add: hub_allocates_id_then_owner_finalizes
    search: hub_tasks_plus_local_docs_plus_role_aware_knowledge
    rejects: [owner_proxy, implicit_replica_as_current]
