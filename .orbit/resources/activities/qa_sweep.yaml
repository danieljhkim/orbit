schemaVersion: 2
kind: Activity
metadata:
  name: qa_sweep
spec:
  type: deterministic
  description: >
    Run the mechanism-agnostic QA sweep core for one explicitly named
    workspace. The workspace input is required so scheduled callers cannot
    accidentally broaden a single-workspace routine into a host-wide pass.
  input_schema_json:
    type: object
    additionalProperties: false
    required: [workspace]
    properties:
      workspace:
        type: string
        minLength: 1
  output_schema_json:
    type: object
    required: [lock_busy, workspaces, reports]
    properties:
      lock_busy:
        type: boolean
      workspaces:
        type: number
      reports:
        type: array
        items:
          type: object
  action: qa_sweep
  config: {}
