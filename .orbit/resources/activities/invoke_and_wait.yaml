schemaVersion: 2
kind: Activity
metadata:
  name: invoke_and_wait
spec:
  type: deterministic
  description: >
    Submit a named v2 Job and block until its Run reaches a terminal
    state, then return the wait entry as data. Internally chains
    `orbit.pipeline.invoke` (to submit the child Run) and
    `orbit.pipeline.wait` (to block on completion). Workflows that require
    a successful child Run should follow this activity with
    `pipeline_success_guard` after any cleanup that depends on the raw
    child status. Callers that must create at most one child across parent
    retry/resume may set `dedupe_run_input_field`; an existing child with the
    same job and exact persisted input-field value is reused, while multiple
    matches fail closed. The returned `status` mirrors the child Run's terminal state:
    `succeeded`,
    `failed`, `cancelled`, or `timeout`. A `timeout` here means the
    WAIT side of the activity exceeded `timeout_seconds`; the child
    Run itself may still be running — callers that care must inspect
    `run_id` to decide follow-up. Gate workflows may pass
    `admission_task_ids` and `admission_workflow` to re-check workflow
    admission immediately before dispatch; stale `review` / `done` tasks
    return a succeeded no-op output with `skipped: true` and do not submit a
    child Run.
  input_schema_json:
    type: object
    required: [job_name, run_input]
    properties:
      job_name:
        type: string
      run_input:
        type: object
      timeout_seconds:
        type: number
        minimum: 1
        maximum: 7200
      poll_interval_seconds:
        type: number
        minimum: 1
      priority:
        type: string
        enum: [low, medium, high, critical]
      dedupe_run_input_field:
        type: string
        minLength: 1
      admission_task_ids:
        type: array
        items:
          type: string
      admission_workflow:
        type: string
  output_schema_json:
    type: object
    required: [status, run_id]
    properties:
      status:
        type: string
        enum: [succeeded, failed, cancelled, timeout, pending, running]
      run_id:
        type: string
      finished_at:
        type: string
      pipeline:
        type: object
      error:
        type: string
      skipped:
        type: boolean
      reason:
        type: string
      task_statuses:
        type: array
        items:
          type: object
  action: invoke_and_wait
  config: {}
