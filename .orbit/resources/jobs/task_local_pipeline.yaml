# Task bundle local pipeline.
#
# Failure semantics:
# - `implement_bundle` runs one task at a time in the shared worktree.
# - If `implement_one` fails, pending changes remain in the shared worktree for inspection.
# - If all implementations succeed, `commit` snapshots the bundle branch before merge.
# - Tasks move to `review` only after the full bundle commits and merges cleanly.
#
# Independent review is a published-candidate contract and is supported only
# by `task_pr_pipeline`. The canonical ship surface rejects local review
# before submission; the first step below also fails closed for direct leaf
# invocations so an enabled review cannot be silently ignored or start local
# implementation work.

schemaVersion: 2
kind: Job
metadata:
  name: task_local_pipeline
spec:
  state: enabled
  kind: workflow
  max_active_runs: 10
  default_input:
    task_ids: []
    auto_push: false
    base_branch: main
    base_sync: remote
    review: false
    review_crew: null
  
  steps:
    - id: reject_unsupported_review
      when: "{{ input.review }} == true"
      target: activity:pipeline_success_guard
      default_input:
        context: task_local_pipeline review is unsupported
        result:
          status: failed
          error: independent review requires PR mode and a published candidate

    - id: worktree
      target: activity:worktree_setup
      retry:
        max_attempts: 4
        initial_backoff_ms: 200
        backoff_cap_ms: 2000
        backoff_strategy: exponential
      default_input:
        task_ids: "{{ input.task_ids }}"
        base: "{{ input.base_branch }}"
        base_sync: "{{ input.base_sync }}"

    - id: implement_bundle
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 256
        steps:
          - id: implement_one
            recovery_activity: step_failure_recovery
            target: activity:agent_implement
            default_input:
              task_id: "{{ item }}"
              workspace_path: "{{ steps.worktree.output.workspace_path }}"
              repo_root: "{{ steps.worktree.output.workspace_path }}"

    - id: commit
      recovery_activity: step_failure_recovery
      target: activity:git_commit
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        scope: all
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        base_ref: "{{ steps.worktree.output.base_ref }}"
        base_sha: "{{ steps.worktree.output.base_sha }}"

    - id: merge
      recovery_activity: step_failure_recovery
      target: activity:git_merge
      default_input:
        job_run_id: "{{ steps.worktree.output.job_run_id }}"
        base: "{{ input.base_branch }}"
        # Setup honors input.base_sync when choosing the immutable starting
        # point. By merge time, an earlier local run may legitimately have
        # advanced this same base before its later checkpoints completed, so
        # reconcile against the current local base and preserve that history.
        base_sync: local
        strategy: fast_forward
        workspace_path: "{{ steps.worktree.output.workspace_path }}"

    - id: mark_review
      loop:
        items: "{{ input.task_ids }}"
        max_iterations: 256
        steps:
          - id: mark_review_one
            target: activity:update_task
            default_input:
              task_id: "{{ item }}"
              status: review

    - id: push
      when: "{{ input.auto_push }} == true"
      recovery_activity: step_failure_recovery
      target: activity:git_push
      default_input:
        workspace_path: "{{ steps.worktree.output.workspace_path }}"
        branch: "{{ input.base_branch }}"
