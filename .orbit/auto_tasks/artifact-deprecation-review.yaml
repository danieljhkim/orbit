schemaVersion: 1
name: artifact-deprecation-review
description: Recurring report-only review that surfaces potentially stale learnings and stale artifact-id comment references via execution_summary
enabled: true
schedule:
  cron: 0 5 * * 1
template:
  title: Review learnings and comment references for deprecation candidates
  description: |
    This is a REPORT-ONLY review: the entire deliverable is a ranked list of
    candidates, each with evidence, written into this task's
    `execution_summary`. Do NOT deprecate, delete, supersede, archive, or
    otherwise change any learning, ADR, task, or friction record, and do NOT
    edit any comment in the codebase — curation decisions are applied
    separately by a human, through `orbit learning update` / the archival
    surface for learnings, or by hand for comment edits.

    Gather evidence from two independent streams and reason from them; there
    are no hard-coded staleness thresholds, so use judgment.

    ## Stream A — learning corpus health

    1. Usage rollups — run `orbit learning stats --json` (falls back to
       `orbit tool run orbit.learning.stats` where the CLI is unavailable).
       Each row carries `injected_count`, `shown_count`, `shown_ratio`,
       `last_injected_at`, and `last_shown_at`. Injection-side counters are
       frozen as of 2026-07-20 because automatic delivery ended; zero new
       injections is expected and is not an error. Combine with each learning's
       age from `orbit learning list --json` (`created_at` / `updated_at`).
       A learning that is old and has never been shown, or that was injected
       historically but never shown, is a candidate.
    2. Anchor health — from `orbit learning list --json`, inspect each active
       learning's `scope.paths`. Flag:
         * empty path scopes (`scope.paths == []`) — there is no path anchor
           to inspect, so confirm that a tag scope or reference comment still
           gives the learning a useful locator;
         * path globs that match nothing in the current tree (the anchored
           file/dir no longer exists, or the glob was written for a different
           repo layout) — these silently never fire.

    Cross-reference the two signals, then rank the potentially stale
    learnings. For each, cite the concrete evidence (counts, ratios,
    timestamps, the offending glob) and a one-line rationale. Rank by
    leverage: over-broad or dead globs and never-useful never-shown learnings
    first. Note learnings you considered but are keeping, and why.

    Calibration: the 2026-07-18 learning-hook relevancy audit
    (`operations/reports/2026-07-18-learning-hook-relevancy-audit.md`) flagged
    L-0074, L-0077, L-0068, and L-0041 (over-broad / layout-mismatched globs)
    plus the six empty-path learnings. The first cycle should reproduce that
    candidate set, or explain in the summary why any candidate now differs
    (e.g. a glob was already narrowed, or a learning was superseded).

    ## Stream B — comment-reference sweep

    Point-of-use reference comments (`L-xxxx` / `ADR-xxxx` / `ORB-xxxx` /
    `F2026-xx-xxx` + a short claim) are the delivery mechanism for durable
    knowledge at code boundaries. Those references go stale the same way the
    learnings they point at do, so sweep for them too:

    1. Grep the constellation checkout reachable from this workspace root for
       artifact-id patterns in comments — orbit at minimum, and any sibling
       codebase under the workspace root you can reach. Patterns:
       `L-\d{4}`, `ADR-\d{4}`, `ORB-\d{5}`, `F\d{4}-\d{2}-\d{3}`.
    2. Resolve each match against its registry: `orbit learning show <id>` for
       `L-` ids, `orbit adr show <id>` for `ADR-` ids, `orbit task show <id>`
       for `ORB-` ids, `orbit friction show <id>` for `F` ids.
    3. Report references whose artifact is missing, rejected, superseded, or
       otherwise stale relative to the comment's claim. For each, give
       `file:line` evidence, the exact comment text (the claim), and the
       artifact's current state (not found / rejected / superseded-by-<id> /
       etc).

    Rank Stream B findings alongside Stream A's, evidence-first.

    Fail open. If `orbit learning stats` reports no events (empty rollup), the
    usage/anchor data is otherwise missing or empty, or the comment sweep
    finds no artifact-id references at all, report that nothing looks stale
    for that stream rather than erroring — an empty corpus, a fresh
    workspace with no audit history, or a codebase with no reference comments
    yet is a valid "nothing to deprecate" outcome, not a failure.
  acceptance_criteria:
  - Potentially stale learnings are listed in execution_summary, each with concrete evidence (usage counts/ratios/timestamps and/or anchor-health findings).
  - Stale comment references are listed in execution_summary, each with file:line evidence, the comment's claim, and the referenced artifact's current state.
  - No learning, ADR, task, or friction record was deprecated, deleted, superseded, archived, or given a new state, and no comment was edited — the run is report-only.
  - An empty or missing usage rollup, or a sweep with no matches, produced a "nothing stale" report for that stream rather than an error.
  task_type: chore
  tags:
  - artifact-deprecation
  - no-diff-expected
  priority: medium
  crew: opus
  status: backlog
dedupe: skip_if_open
created_by: system
