summary: Activity and job YAMLs live in TWO trees — crates/orbit-core/assets/{activities,jobs}/ (compiled, seeds new workspaces) and .orbit/resources/{activities,jobs}/ (what this workspace runs). Editing only the asset never takes effect here; update both, verify with cmp.
body: |
  # Activity and job definitions live in two trees; edit both or the change is inert

  ## Rule

  When you change an activity or job YAML, change it in both places in the same commit:

  - `crates/orbit-core/assets/{activities,jobs}/<name>.yaml` — compiled into the binary, seeds every new workspace
  - `.orbit/resources/{activities,jobs}/<name>.yaml` — the workspace-local copy this checkout actually executes

  Then verify they match: `cmp crates/orbit-core/assets/activities/<name>.yaml .orbit/resources/activities/<name>.yaml`. Byte-identical is the standard, not "equivalent".

  ## Why

  The workspace copy is what the runtime resolves for that workspace. Editing only the shipped asset produces a change that is correct in the binary, correct for every workspace created afterwards, and silently absent from the repo you are working in. Nothing errors. The old definition simply keeps running, and the fix appears to have landed.

  This is the same two-tree shape as Orbit skills, and it fails the same way: the drift is invisible until someone diffs the trees.

  ## How to apply

  - Treat "update the workspace mirror" as part of the edit, not follow-up work. A task spec that touches an activity should say so; the specs that say it explicitly are the ones that come back correct.
  - Verify with `cmp`, not by eye. A YAML re-serialization that re-wraps a `required: [a, b, c]` list across lines is semantically identical and still counts as drift — it means one copy was regenerated and the other was hand-edited, so the next real change will conflict.
  - When auditing, diff the whole directory rather than the file you touched. Drift accumulates quietly across unrelated files.
  - New workspaces are not automatically safe over time. They start in sync and drift as later asset changes land without propagation.

  ## What not to do

  - Do not edit only `crates/orbit-core/assets/**` and assume the running workspace picks it up. It does not.
  - Do not edit only `.orbit/resources/**` either. That fixes the local workspace and ships nothing — every other workspace, and every future one, keeps the old behaviour.
  - Do not treat a formatting-only difference as harmless and skip it. It is evidence the two copies have separate edit histories.

  ## Evidence

  Measured across the constellation on 2026-08-01, against the 37 shipped activity assets:

  - one workspace: 0 differ, 0 absent — fully in sync, so parity is achievable and is the correct target state
  - the orbit workspace itself: 4 differ, 0 absent
  - a knowledge workspace: 10 differ, 3 absent

  Three of the orbit workspace's four were cosmetic — one differed only by line-wrapping of a `required: [...]` list. The fourth was substantive: the workspace copy of `agent_implement.yaml` lacked the `skipped_reason` output field and an entire terminal-task precheck instruction block. `agent_implement` is the implement step of every ship run in that workspace, so ship runs had been executing without that precheck while the shipped asset carried it.

  The counter-example is the useful half. A task whose acceptance criteria explicitly required "both the compiled asset and the .orbit/resources workspace copy, kept byte-identical" produced an execution summary reporting a `cmp` of the two copies as part of its validation. Naming both trees in the spec is what made the agent check. Where the spec did not name them, the mirror was left behind.
