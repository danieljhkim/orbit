summary: 'Agent-loop step outputs are advisory: never mark an activity output field `required`, template a job step off an agent step''s `.output.*`, or branch executor control flow on agent-returned JSON. Gate on durable state — task record, run checkpoints, re-inspected git/PR world.'
body: |
  # Jobs and activities must not depend on agent outputs

  ## Rule

  Do not require or depend on agent outputs within jobs or activities — it is too
  fragile.

  An agent-loop step's structured result is **advisory**. Anything a job, an
  activity, or the executor's control flow needs must come from durable state:

  - the **task record** — persisted execution summary, status, comments;
  - the **run's own records** — the step and checkpoint rows in the store;
  - **deterministic re-inspection of the world** — does the branch exist, does the
    PR exist, is the tree clean, what does the base resolve to.

  Three shapes are the violation:

  1. a `required:` entry in an agent activity's `output_schema_json`;
  2. a job step whose `when:` or input template reads another *agent* step's
     `.output.*`;
  3. executor or engine code that branches on a field of agent-returned JSON.

  Deterministic activities are a different case: their output is computed rather
  than narrated, so templating a downstream step off one is fine.

  ## Why

  An agent's structured result is best-effort, and every layer of the stack
  already says so:

  - **It is not persisted as the system of record.** The implement activity's own
    preamble states this outright — the result object returned at the end is not
    where the work is recorded. A field in it is therefore a *claim about* durable
    state, never the state itself.
  - **It is schema-optional in practice.** The CLI backend treats response parsing
    as advisory unless an activity explicitly opts into strict envelope
    validation, and the agent-loop dispatch path does not validate
    `output_schema_json` at all. A `required:` list buys no enforcement — it only
    advertises a dependency that a later validation pass would make load-bearing,
    silently converting a reporting gap into a hard failure.
  - **It is absent or partial exactly when it matters most.** Agents get
    truncated, time out, hit an iteration cap, or crash. The runs where a
    structured result goes missing are disproportionately the runs that already
    failed — which is to say, precisely the runs where recovery and reporting
    logic is the thing executing.

  Put together: a pipeline that gates on an agent-returned field inherits that
  agent's worst day. The failure mode is silent and inverted — the agent did the
  work, durable state proves it, and the pipeline discards it because a string was
  missing.

  There is a second, subtler cost. Writing "return X so that the executor does Y"
  into an instruction asserts a causal link the code may not implement. Once an
  instruction claims a field drives control flow, readers believe it and future
  changes preserve it, and nobody re-checks the executor. Reporting fields must be
  described as reporting, so no one mistakes them for a contract.

  ## The correct pattern

  - **Keep the fields.** Observability is a real need: post-mortems, audits, and
    logs all want to know what a step believed it did.
  - **Declare them optional** — no `required:`, no `additionalProperties: false`.
    A partial report must never undo durable work.
  - **Establish the outcome from durable state.** Where a step delivered
    something, the evidence is the artifact existing — the PR, the commit, the
    task status — re-checkable by anyone at any later time, not a boolean the
    agent set.
  - **Say so in the instruction**, so the agent understands its result is a record
    and not a lever.

  ## Evidence

  PR #705 revised the step-failure recovery activity so it could deliver completed
  work, and in doing so added `additionalProperties: false` plus a nine-field
  `required:` list to that activity's `output_schema_json`, together with
  instruction text tying the executor's one post-recovery retry to a returned
  `recovered` value.

  None of it was load-bearing, and the dependency was pure latent fragility: a
  `recovery_activity` is a step *attribute* rather than a step, so it has no step
  id and no template can read its output; the executor gates its single
  post-recovery attempt on the dispatch completing and never reads `recovered` at
  all. The instruction's causal claim was simply not true of the code. The change
  required a revision PR before it could merge.
