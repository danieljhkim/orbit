summary: MCP result decorators receive pre-broker session context
body: Result decoration runs with the original server-call ToolSessionContext, not the broker-normalized copy. A decorator that performs a workspace-scoped follow-up lookup must recover the stable workspace selector from the original tool input (or otherwise carry it explicitly) before invoking owner routing. Assuming the broker mutation is visible causes hub-side follow-up calls to lose workspace identity; swallowing that error can silently suppress knowledge sidecars, while propagating it breaks otherwise-valid hub calls.
