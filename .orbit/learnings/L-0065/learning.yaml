summary: MCP workspace routing is per initialize/session context or explicit registered workspace; `orbit mcp serve` advertises the canonical surface independently of cwd and rejects `--root`.
body: |-
  ## Historical symptom

  Before ADR-0199 was implemented, MCP tool registration depended on finding a workspace from the server launch directory. Cowork launches could use an internal scratchpad for cwd and `CLAUDE_PROJECT_DIR`, so Orbit installed an empty host and exposed only graph tools. The former workaround was to pass `--root <repo>` to `orbit mcp serve`.

  ## Current invariant

  ORB-10262 replaced launch-time workspace discovery with the exact-checkout broker, and ORB-10319 moved that broker into `orbit-remote`. The server advertises the canonical MCP schema independently of cwd. Each call resolves a registered workspace from explicit input or trusted initialize/session context; absent selection fails clearly instead of inheriting process cwd.

  `orbit mcp serve` intentionally rejects the global `--root` override. The shipped plugin command must omit it. If a Cowork call lacks workspace selection, provide the registered `workspace` selector or correct the client's MCP roots/session metadata; changing the launch cwd is not a routing fix.

  ## Regression guard

  Keep `plugin/.mcp.json`, the README, the Orbit skill guide, and the runtime-free `ServeArgs` contract aligned. A graph-only advertised surface or a plugin launch command containing `--root ... mcp serve` is a regression.
