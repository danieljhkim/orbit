summary: Before orbit workspace init in a nested repo, verify orbit_dir is <child>/.orbit; stop if it resolves to the parent, and never use --root <child>/.orbit to force it because --root relocates machine-global state.
body: 'Incident on 2026-08-01: initializing codebases/parallax beneath the constellation workspace resolved the parent constellation/.orbit. Retrying with --root codebases/parallax/.orbit created machine-global files such as workspaces.json inside the child workspace. Guardrail: inspect the orbit_dir printed by workspace init and stop immediately unless it is the intended repository-local .orbit. Treat --root as a global-root relocation, not as a way to select a nested workspace directory. Keep ~/.orbit/workspaces.json as the machine registry and each checkout entry pointed at that repository local .orbit.'
