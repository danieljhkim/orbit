summary: Run orbit-cli semantic-companion tests under umask 077 so tempfile parents pass executable-path safety checks
body: The search companion rejects an override when its parent directory is group/world writable. Agent executors may inherit a permissive umask, causing tempfile directories in the docs integration suite to fail this safety check before behavior is exercised. Run the suite with `umask 077`. When also running workspace-discovery tests, place `TMPDIR` in a secure directory outside the repository so temporary workspaces are not mistaken for nested worktrees.
