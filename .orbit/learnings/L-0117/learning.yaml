schema_version: 1
id: L-0117
status: active
scope:
  paths:
  - '**/*.md'
  - crates/orbit-core/assets/**
  - plugin/skills/**
  - .orbit/auto_tasks/**
  - .orbit/resources/**
  - .orbit/routines/**
  tags:
  - instructions
  - portability
summary: Use repo-relative paths in docs and shipped instruction assets; never bake in a machine-, user-, or checkout-specific absolute path unless a runtime contract explicitly requires one.
body: |-
  Portable instruction surfaces include documentation, skill instructions, prompt/template assets, activities, jobs, routines, policies, auto-tasks, and examples.

  When referring to a repo-owned file or directory:
  - Prefer a path relative to the repository or workspace root, for example `crates/orbit-core/assets/skills/orbit-task/SKILL.md`.
  - If the execution working directory is ambiguous, state the intended root or use a symbolic placeholder such as `<repo-root>/...`; do not embed `/home/<user>`, `/Users/<user>`, a temporary worktree path, or `~`.
  - If an interface truly requires an absolute path, derive or resolve it at runtime from the workspace/configuration and state why. Do not copy the resolved local value into shipped content.
  - Review new or changed instruction content for filesystem-root or home-directory prefixes before shipping.

  Incident: PR #795 hard-coded `/home/daniel/workspace/constellation/codebases/orbit/crates/orbit-core/assets/skills/orbit-task/SKILL.md` in `.orbit/auto_tasks/friction-curation.yaml`; review comment https://github.com/danieljhkim/orbit/pull/795#discussion_r3653954119 noted that it should be relative so the instruction remains portable across users, machines, and checkouts.
evidence:
- kind: external
  reference: https://github.com/danieljhkim/orbit/pull/795#discussion_r3653954119
