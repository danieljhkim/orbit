summary: UI acceptance requires rendered evidence, not semantic string tests
body: |-
  # Rule

  When a dashboard or UI change introduces a new presentation surface, data-contract correctness and DOM or source-string presence are necessary but not sufficient. The task's modification scope must include every required presentation layer, especially the stylesheet, and acceptance must require inspection of the rendered result at representative desktop and narrow viewports. Asset tests that only search source strings can prove that semantics exist, but cannot validate visual hierarchy, readability, spacing, wrapping, density, content-driven height, or responsive behavior. Waiving an independent review does not waive implementation-side visual acceptance.

  ## Evidence

  - ORB-10582 / PR #857 added a Managed Execution Cost panel with semantic labels and passing string-presence tests, but its context_files omitted dashboard.css and the landed change added no CSS for the new classes.
  - A rendered desktop screenshot on 2026-08-01 showed raw line-oriented prose, labels running together, weak hierarchy, and a large unused panel area despite all scoped tests passing.
