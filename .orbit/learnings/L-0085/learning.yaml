summary: On dk-server-1 the connected GitHub app is read-only for PR comments and merges; use it for reads and authenticated gh for writes.
body: The connected GitHub app can fetch PR metadata and patches but its comment and merge mutations return HTTP 403 Resource not accessible by integration. For repository writes use the authenticated gh CLI fallback. Before merging verify the local repository and target branch plus the PR base and expected head SHA; invoke gh pr merge with match-head-commit. Continue using the app for read-oriented metadata because those calls succeed.
