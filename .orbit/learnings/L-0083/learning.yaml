summary: Never remove or renumber a shipped SQLite migration; preserve its ledger entry across reverts and history rewrites so shared stores remain readable
body: A migration becomes a durable data-compatibility contract as soon as any released, retained, or concurrently running Orbit binary can record it in a shared store. Git reachability does not revoke that contract. If the feature is reverted or branch history is repaired, keep the shipped migration number, name, and an idempotent apply path in the registry. Reverse an unwanted schema change with a new forward migration; never delete or reuse the old entry. Add a regression that seeds the highest shipped ledger version and reopens the store, because fresh-database tests alone cannot catch a dropped migration.
