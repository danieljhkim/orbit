summary: Quiesce timers and all Orbit processes before downgrading a reverted store migration; verify schema compatibility with migrate dry-run, not semver
body: |
  When a store migration is reverted, quiesce every process that can open the global database before downgrading it—not only long-lived web/MCP workers. Timers and transient services can start the still-installed newer binary and immediately reapply the reverted migration.

  Before changing the ledger or schema:

  - enumerate active pipeline workers, web/MCP processes, and user timers/services;
  - stop the relevant timers and services;
  - take and integrity-check a SQLite backup;
  - rehearse the inverse migration on a copy;
  - downgrade the database and atomically swap to the compatible binary in the same maintenance window;
  - restart timers/services and verify at least one real scheduled firing leaves the target schema unchanged.

  Do not use `orbit --version` alone as the compatibility check: builds from different commits can share the same semver while embedding different `SUPPORTED_SCHEMA_VERSION` values. Use `orbit migrate --dry-run --json` and compare both `schema.current` and `schema.supported`.
