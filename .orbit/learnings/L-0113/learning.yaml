summary: 'Remote-tracking refs are shared by every linked worktree: a pipeline step must consume a SHA pinned at setup, never re-resolve `origin/<base>` mid-run.'
body: |-
  `refs/remotes/origin/<branch>` lives in the shared `.git`, so every linked worktree sees one value. Any run's `worktree_setup` fetch, any rescue fetch, and every PR merge moves it — while other runs are still in flight.

  A later step that re-resolves the *name* therefore reads a different commit than the one its worktree was created at. Orbit's commit step did exactly this in a `merge-base --is-ancestor <base> HEAD` guard: once the ref moved, the guard was false by construction and the run died. Every new run's fetch retroactively invalidated every older in-flight run, so concurrent dispatch was unsafe (five failures on 2026-07-25; 7/7 correlation against the reflog).

  Rule: whichever step creates the worktree resolves the start point once (`rev-parse --verify <ref>^{commit}`), publishes the resulting id, and every downstream step that must reason about the history *this run* authored consumes that id. Enforce it at the input boundary — reject a value that is not a full object id — so the failure cannot be reintroduced by pipeline wiring. Only steps whose job is reconciling with the live base (rebase/sync, PR base) should keep the moving name.

  Diagnosis note: two call sites emitted the same error string for unrelated conditions (empty stage vs. failed ancestry), which cost three diagnosis cycles, two of them reaching confidently wrong conclusions. A failure message should report measured state (resolved base, HEAD, staged/unstaged/untracked counts) and assert no cause it did not observe.
