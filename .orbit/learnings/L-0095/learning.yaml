summary: Treat provider cwd as advisory in worktree-backed runs; fingerprint assigned and registered-primary Git state around spawn and fail closed on any primary delta.
body: 'A canonical `Command::current_dir` is necessary but is not a write-boundary postcondition: provider/tool behavior can still materialize changes in the registered primary checkout. For every linked-worktree provider invocation, capture read-only pre/post identities for both checkouts (HEAD/branch, semantic index, tracked patch, and untracked path content), permit pre-existing primary dirtiness only when unchanged, and classify any primary delta as non-retryable. If the assigned checkout also changed, report ambiguous integrity rather than attributing, copying, committing, cleaning, or reconciling either checkout. Verify the boundary after success, nonzero exit, and timeout before deterministic shipment phases can continue.'
