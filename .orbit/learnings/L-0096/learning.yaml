summary: 'Adding a canonical MCP builtin: update the CLI production tools_list snapshot (not the wire fixture), the mcp_definitions count, and conformance-v1.yaml'
body: 'When adding a canonical model-callable MCP builtin (register_mcp in crates/orbit-tools/src/builtin/orbit/mod.rs), two snapshots gate it and they are DIFFERENT surfaces: crates/orbit-cli/tests/snapshots/mcp_tools_list.json is the real `orbit mcp serve` canonical builtin surface and MUST gain the new tool; crates/orbit-mcp/tests/snapshots/wire_tools_list.json is a hand-built FIXTURE host (3 fake task tools + the orbit.graph.* adapter) that exercises ToolSchema->JSON-Schema conversion, NOT the canonical registry, so it does NOT change when you add a canonical tool. Also bump the count in crates/orbit-tools/tests/mcp_definitions.rs (canonical_builtin_definitions_are_workspace_independent) and add the row to docs/design/mcp-bridge/references/conformance-v1.yaml (validated by canonical_mcp_policy_conforms_to_frozen_v1_fixture). Regenerate both snapshots with ORBIT_MCP_UPDATE_SNAPSHOT=1. An operator-only tool may also be absent from an agent-capability session''s tools/list (effective-session omission), which is a separate reason it can look ''missing''.'
