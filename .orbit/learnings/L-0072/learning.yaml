summary: Any host-global SQLite table in orbit.db that is shared across workspaces must carry a workspace_id column (composite PK), and every read/write/truncate/rebuild must filter by the runtime's stable registered workspace_id (from .orbit/config.yaml) — not a path-derived label.
body: 'The `learnings_index` table shipped keyed only by learning ID with no workspace discriminator, while it lives in the host-global `~/.orbit/orbit.db` shared by every workspace runtime (each paired with its own workspace-local YAML). A multi-workspace ship sweep on dk1 then searched, truncated, and overwrote other workspaces'' rows: reminder hydration emitted `learning not found: L-0002` bursts, and because legacy workspaces hold DIFFERENT records under the same canonical ID, a foreign summary could be silently injected under a local ID. Fix (ORB-10113 / ADR-0212): composite `(workspace_id, id)` PK + filter every op by the runtime''s workspace_id — the SAME stable id already used by `job_runs` and `v2_audit_events` (job_run_store/v2_audit were the correct prior art; learnings_index was the outlier). Rule of thumb when adding or reviewing a host-global SQLite table: if it can hold rows for more than one workspace, it needs `workspace_id` in the schema AND in every WHERE/DELETE/ON CONFLICT clause; a table-wide `DELETE`/truncate is a cross-workspace footgun. Legacy unscoped rows can''t be attributed, so migrate by discard + rebuild from the source of truth, never by guessing ownership.'
