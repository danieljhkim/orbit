summary: Orbit skill edits must land in both the assets and plugin skill trees
body: 'Agent skills live in two parallel trees: crates/orbit-core/assets/skills/<name>/SKILL.md (source of truth, seeds every workspace on orbit init) and plugin/skills/<name>/SKILL.md (shipped in the Claude Code plugin). Editing only one silently diverges them locally. Parity IS machine-enforced: crates/orbit-core/src/command/skill.rs::plugin_skill_symlinks_resolve_to_assets fails when a plugin skill dir is neither a symlink to nor a byte-for-byte materialized copy of the asset dir, and flags orphan entries and skills missing from default_skill_ids(). But that only catches drift after a push — before committing, run `diff -rq` between the two trees for the touched skill (or check `git diff --stat` names both paths) and update both in the same commit. Symlink and materialized copy are both valid forms: Codex plugin installs copy the plugin package without following directory symlinks, so a materialized copy is not drift. `orbit-workflow` is intentionally assets-only (listed in PLUGIN_EXCLUDED_SKILLS — no `orbit run` surface in the plugin); never "fix" its absence from plugin/skills/. Adding a new CLI-only skill means updating that list. Complements L-0005 (which copy is authoritative) — this learning covers how many places one edit must land. Evidence: 2026-07-26, plugin/skills/orbit-task/SKILL.md edited without updating the assets copy; caught by hand, repaired.'
evidence:
- kind: external
  reference: 2026-07-26 orbit-task skill divergence, repaired same day
