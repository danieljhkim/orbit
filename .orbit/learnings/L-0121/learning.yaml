summary: Independent review and deployed-asset preflight are retired; after upgrading, republish host execution profiles and remove or reseed stale global workflow assets.
body: ORB-10628 removed the independent review subsystem and the deployed-YAML contract preflight that existed solely for it. Do not restore that feature-specific preflight as a generic safety rule. The ship closure digest changed, so published host execution profiles and registry projections must be regenerated after deployment. Operator-global seeded workflow assets take precedence over repository assets; overwrite, reseed, or remove stale review-era copies during upgrade so they cannot shadow the new shipment contract.
