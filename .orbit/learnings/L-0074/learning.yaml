summary: 'Default activity tool allowlists: concrete names must be active registered tools — orbit.task.locks.*, fs.ls, orbit.task.search fail load validation (UnknownToolName) even though they look real; wildcards pass if one name matches.'
body: 'When authoring an `agent_loop` activity under `crates/orbit-core/assets/activities/`, every concrete entry in `tools:` is validated at catalog load against `OrbitRuntime::allowlist_known_tool_names()` — the *active* tool registry schemas plus the `orbit.graph.*` adapter names. Tools registered with `register_inactive` (e.g. `orbit.task.locks.release`/`reserve`) and unregistered names (`fs.ls`, `orbit.task.search`) fail with `ToolAllowlist { source: UnknownToolName }`, which breaks seemingly unrelated tests (`default_activity_catalog_allowlists_resolve_registered_tools`, every `task_gate_*` exec test) because the whole catalog fails to load. Wildcard entries (`orbit.task.*`) sail through as long as *one* registered name matches the prefix, so an allowlist can look consistent with existing activities and still be invalid. Before adding a concrete name, confirm it appears in `tool_registry().schemas()` (grep for `registry.register(` vs `register_inactive(` in `crates/orbit-tools/src/builtin/`).'
