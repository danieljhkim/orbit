summary: When tightening MCP exposure preflight, preserve audit dispatch for truly unknown names while rejecting declared schemas whose policy is missing or invalid
body: |-
  ORB-10254 initially made the orbit-mcp adapter return early for every name absent from the validated advertised-definition set. That correctly failed closed for schemas with missing policy, but it also bypassed RuntimeMcpHost for genuinely unknown or intentionally unexposed names. The runtime host owns rejected-call audit insertion, so the existing orbit.graph.pack integration test observed zero failure audit rows.

  Keep two cases distinct: a schema that the host or in-process adapter declares without a valid policy must be rejected by the adapter before exposure or dispatch; a name that no schema declares should continue to the host preflight, which rejects it and records the canonical failure audit. Test both missing-policy rejection and the unknown-name audit side effect whenever exposure policy is tightened.
