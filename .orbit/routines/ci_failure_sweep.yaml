# Default CI-failure sweep routine [ORB-11107]. Seeded into `.orbit/routines/`
# on `orbit init` with the routine name and host pin resolved at seed time (see
# `seed_default_routines`). It only fires from workspaces whose config declares
# `[routines] role = "source"`. The versioned `enabled` switch is deliberately
# false when seeded: turning on unattended CI-failure filing is an explicit,
# reviewed, per-workspace decision.
#
# This routine is a scheduling surface only. All discovery, clustering, dedupe,
# and filing live in the job's two deterministic steps, so an operator-triggered
# run of `ci_failure_sweep_pipeline` behaves identically to a scheduled fire.
#
# Cadence is hourly, on a minute that stacks with none of the other shipped
# defaults (the triage routine holds :15, worktree GC :35, and the ship sweep
# :00/:20/:40). `overlap: forbid` plus the job's `max_active_runs: 1` keep the
# sweep single-flight, so a sweep that runs long skips its next slot rather than
# double-filing; the job's failure-key dedupe makes a repeat pass idempotent in
# any case.
#
# This is the intended long-run replacement for the shipped
# `ci-failure-remediation` auto-task definition, which does its CI discovery
# from inside the execution sandbox. Both ship inert, side by side, until this
# sweep is proven.
schemaVersion: 1
name: ci-failure-sweep-orbit
description: >
  Hourly sweep of this repository's current GitHub Actions failures: collect
  bounded, redacted evidence on the host, then file each current, non-stale
  failure cluster as an ordinary backlog bug task carrying that evidence
  inline. Deduped against still-open tasks by failure key.
enabled: true
hosts:
  - dk-server-1
trigger:
  cron: "5 * * * *"
  missed_run: skip
target: job:ci_failure_sweep_pipeline
policy:
  timeout_minutes: 30
  overlap: forbid
