[execution.env]
inherit = false
pass = [
    "HOME",
    "PATH",
    "CODEX_HOME",
    "TMPDIR",
    "USER",
    "__CF_USER_TEXT_ENCODING",
]

[execution.codex]
sandbox = "workspace-write"

[task.approval]
delegate_approval = true
required_for_agent = true

[scoring]
enabled = true

[graph]
editing = false

[workflow]
auto_ship = true
base_branch = "agent-main"
default_crew = "claude"

[routines]
role = "source"

[crews.claude]
model = "claude-opus-4-8"
provider = "claude"
backend = "cli"

[crews.codex]
model = "gpt-5.6-terra"
provider = "codex"
backend = "cli"

[crews.gemini]
model = "pro"
provider = "gemini"
backend = "cli"

[crews.grok]
model = "grok-build"
provider = "grok"
backend = "cli"


[pr]
task_url_template = "https://orbit-cli.com/tasks/{task_id}"

[duel]
candidates = ["codex", "claude", "grok"]

[duel.models]                             
codex  = "gpt-5.6-terra"
claude = "claude-opus-4-8"
grok = "grok-build"

[docs]
roots = ["docs/"]
