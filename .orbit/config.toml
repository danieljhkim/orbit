[execution.env]
pass = [
    "HOME",
    "PATH",
    "CODEX_HOME",
    "TMPDIR",
    "USER",
    "__CF_USER_TEXT_ENCODING",
]

[execution.codex]
sandbox = "danger-full-access"

[workflow]
auto_ship = true
base_branch = "agent-main"
default_crew = "sol"
system_crew = "luna"

[crews.opus]
backend = "cli"
model = "claude-opus-5"
provider = "claude"

[crews.sonnet]
backend = "cli"
model = "claude-sonnet-5"
provider = "claude"

[crews.fable]
backend = "cli"
model = "claude-fable-5"
provider = "claude"

[crews.sol]
backend = "cli"
model = "gpt-5.6-sol"
provider = "codex"

[crews.terra]
backend = "cli"
model = "gpt-5.6-terra"
provider = "codex"

[crews.luna]
backend = "cli"
model = "gpt-5.6-luna"
provider = "codex"

[crews.gemini]
backend = "cli"
model = "gemini-3.7-flash"
provider = "gemini"

[crews.grok]
backend = "cli"
model = "grok-4.6"
provider = "grok"


[pr]
task_url_template = "https://orbit-cli.com/tasks/{task_id}"

[docs]
roots = ["docs/"]
