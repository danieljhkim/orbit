[execution.env]
pass = [
    "HOME",
    "PATH",
    "CODEX_HOME",
    "TMPDIR",
    "USER",
    "__CF_USER_TEXT_ENCODING",
]

[execution.codex]
sandbox = "danger-full-access"

[workflow]
default_crew = "opus"

[crews.qa]
model = "gpt-5.6-terra"
provider = "codex"
backend = "cli"


[pr]
task_url_template = "https://orbit-cli.com/tasks/{task_id}"

[duel]
candidates = ["codex", "claude", "grok"]

[duel.models]
codex  = "gpt-5.6-terra"
claude = "opus"
grok = "grok-build"

[docs]
roots = ["docs/"]
